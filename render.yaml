# Render blueprint: one web service, one URL.
#
# DATABASE_URL is deliberately NOT here. It carries the Neon password, and
# this file is public. `sync: false` makes Render prompt for it once in the
# dashboard and keep it as a secret.
services:
  - type: web
    name: reflex-offers
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Same region as the Neon database. On a laptop-to-Ohio link the offer
    # reads cost seconds; co-locating removes that entirely. See docs/speed.md.
    region: ohio
    # This service is Blueprint-managed, so render.yaml is authoritative:
    # changing the plan in the dashboard is reverted on the next deploy.
    # Starter for the review window — it does not sleep, and Free's ~0.1 vCPU
    # made CPU the bottleneck (see docs/speed.md). Drop back to `free` when
    # the review is over.
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false # set in the dashboard: postgresql+psycopg://…/neondb
      - key: FAULT_INJECTION
        # On for this review so the failure demo can be reproduced in the
        # live app. It only enables the X-Fault header; nothing fails on its
        # own. Remove this for real use.
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        # Two uvicorn workers. Endpoints are sync, so FastAPI runs them in a
        # threadpool — but openpyxl is pure Python and an 8 s .xlsx export
        # holds the GIL, starving everything else in that process. A second
        # worker keeps the health check and other requests answering. Raise
        # only with more CPU; lower to 1 if memory gets tight.
        value: "2"
